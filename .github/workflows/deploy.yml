name: Terraform CICD Pipeline Project
run-name: ${{ github.actor }} has triggered the pipeline

on:
  push:
    branches:
      - 'main'


env:
  AWS_ACTION_KEY: ${{ secrets.ACCESS_KEY}}
  AWS_SECRET_KEY: ${{ secrets.SECRET_ACCESS_KEY }}

jobs:
  build-infra:
    name: terraform-ci-cd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./Modularised-VPC
      - name: Terraform Vaildate
        id: validate
        run: terraform validate
        working-directory: ./Modularised-VPC
      - name: Terraform Plan
        id: plan
        run: terraform plan
        working-directory: ./Modularised-VPC
      - name: Terraform Apply
        id: apply
        run: terraform apply --auto-approve
        working-directory: ./Modularised-VPC
